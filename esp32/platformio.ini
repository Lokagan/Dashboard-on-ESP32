; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
platform 	= espressif32
board 		= esp32-s3-devkitc-1
framework 	= arduino

board_build.mcu 				= esp32s3
board_build.f_cpu 				= 240000000L
board_build.flash_mode 			= qio
board_build.flash_size 			= 16MB
board_build.psram_type 			= opi
board_build.arduino.memory_type = qio_opi
board_build.filesystem 			= littlefs
board_build.partitions 			= partitions.csv
board_upload.flash_size 		= 16MB
board_upload.maximum_size 		= 16777216
monitor_speed 					= 115200

#change for espota/esptool for ota/usb upload :
upload_protocol = espota
upload_port     = Dashboard.local
; Doit correspondre à OTA_PASSWORD de config.h. Défini hors du dépôt via la
; variable d'environnement OTA_PASSWORD (ex. export OTA_PASSWORD=... avant
; `pio run -t upload`), pour ne jamais versionner le secret ici.
upload_flags 	= --auth=${sysenv.OTA_PASSWORD}

build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLV_CONF_INCLUDE_SIMPLE=1
	-DUSER_SETUP_LOADED=1
	-DBOARD_HAS_PSRAM=1
	-mfix-esp32-psram-cache-issue
	-I include
	-include include/User_Setup.h
	-include include/lv_conf.h
	; Wake word seul : on désactive MultiNet (reconnaissance de commandes) dans
	; ESP_SR. esp32-hal-sr.c (compilé depuis les sources) garde tout le chargement
	; MultiNet sous #ifndef CONFIG_SR_MN_EN_NONE — sans ça, multinet->create()
	; alloue trop de RAM interne et la création des tâches SR échoue
	; ("Failed create audio feed task"). MultiNet n'est alors plus chargé même
	; s'il est présent dans le srmodels.bin.
	-DCONFIG_SR_MN_EN_NONE=1

lib_deps = 
	bodmer/TFT_eSPI
	lvgl/lvgl
	fastled/FastLED
	knolleary/PubSubClient
	bblanchon/ArduinoJson
	Wire

lib_extra_dirs =
	squareline

; Applique le correctif couleur ILI9341 à TFT_eSPI avant chaque build
extra_scripts =
	pre:extra_scripts/patch_tft_ili9341.py
